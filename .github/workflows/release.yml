name: Release (Manual)

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version matching package.json (e.g., 1.6.2)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    uses: ./.github/workflows/publish.yml
    with:
      version: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
    secrets: inherit
