name: Publish to NPM

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - '.github/workflows/publish.yml'
      - '.github/scripts/stage-npm.mjs'
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: 'Expected package version for a tag or manual release'
        required: false
        type: string
    secrets:
      NPM_TOKEN:
        required: true

permissions:
  contents: write

concurrency:
  group: npm-stage-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'
          scope: '@seed-ship'

      - name: Install npm with staged publishing support
        run: npm install --global npm@11.17.0

      - name: Install dependencies
        run: npm ci

      - name: Validate publication workflow
        run: node --test .github/scripts/stage-npm.test.mjs

      - name: Run full quality suite
        run: npm run check:all
        env:
          NODE_ENV: test
          CI: true
          SKIP_NETWORK_TESTS: true

      - name: Build package
        run: |
          npm run build
          git restore -- test-data/process

      - name: Stage package for npm approval
        id: stage
        run: node .github/scripts/stage-npm.mjs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          EXPECTED_VERSION: ${{ inputs.version }}

      - name: Create GitHub release metadata
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.stage.outputs.version }}
          NPM_STATE: ${{ steps.stage.outputs.state }}
          STAGE_ID: ${{ steps.stage.outputs.stage_id }}
        run: |
          TAG="v${VERSION}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            exit 0
          fi
          {
            echo "## npm distribution"
            echo
            if [ "$NPM_STATE" = published ]; then
              echo "Version ${VERSION} is available on npm."
            else
              echo "Version ${VERSION} was submitted to npm Staged Packages (ID: ${STAGE_ID})."
              echo "Installation becomes available after a maintainer approves it with 2FA on npmjs.com."
            fi
            echo
            echo 'See docs/CHANGELOG.md for the changes.'
          } > release-notes.md
          release_flags=()
          if [[ "$VERSION" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$TAG" --notes-file release-notes.md "${release_flags[@]}"
